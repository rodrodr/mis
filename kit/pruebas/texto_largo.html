<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capítulo de 100 000 palabras · prueba de rendimiento</title>
<link rel="icon" href="data:,">
<meta name="description" content="Fixture de prueba_texto_largo.py: un capítulo largo generado en el cliente para medir text-wrap y content-visibility.">
<link rel="stylesheet" href="../base.css">
<style>
  @layer components {
    .capitulo[data-ajuste="pretty"] :where(p) { text-wrap: pretty; }
    .capitulo[data-ajuste="wrap"] :where(p) { text-wrap: wrap; }
    .capitulo[data-cv="1"] > :where(section) { content-visibility: auto; contain-intrinsic-size: auto 60rem; }
  }
</style>
</head>
<body>
<main id="principal" class="center lectura stack capitulo">
  <h1>Capítulo de prueba</h1>
  <p>Este capítulo se genera en el navegador con 100 000 palabras para medir el coste de <code>text-wrap: pretty</code> y de <code>content-visibility</code> en una lectura larga. Datos de prueba, no un texto real.</p>
</main>
<script>
  // generación determinista (mulberry32): mismas frases, mismo orden, mismo número de palabras
  (function () {
    const q = new URLSearchParams(location.search), main = document.getElementById('principal');
    main.dataset.ajuste = q.get('ajuste') || 'wrap';
    main.dataset.cv = q.get('cv') || '0';
    const frases = ['La cámara de los diputados abrió la sesión a las cuatro de la tarde.', 'Las notas al margen acompañan el texto sin interrumpirlo.', 'Un interlineado generoso deja respirar la página sin romper el ritmo de la lectura.', 'El presidente concedió la palabra al portavoz del grupo, que habló durante veinte minutos.', 'Las figuras no deben partirse entre dos páginas ni separarse de su pie.', 'Volver al mismo párrafo tras cambiar la fuente es una promesa difícil de cumplir.', 'La votación se aplazó hasta el martes siguiente por falta de quórum.', 'Cada año se publican más diarios de sesiones digitalizados y con texto completo.'];
    let a = 7; const azar = () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    let palabras = 0, n = 0, seccion = null;
    const frag = document.createDocumentFragment();
    while (palabras < 100000) {
      if (n % 20 === 0) { seccion = document.createElement('section'); seccion.className = 'stack'; const h = document.createElement('h2'); h.textContent = `Sección ${n / 20 + 1}`; seccion.append(h); frag.append(seccion); }
      const p = document.createElement('p'); p.id = `p-${++n}`;
      let texto = '';
      const k = 3 + Math.floor(azar() * 5);
      for (let i = 0; i < k; i++) texto += (i ? ' ' : '') + frases[Math.floor(azar() * frases.length)];
      p.textContent = texto; palabras += texto.split(' ').length; seccion.append(p);
    }
    main.append(frag);
    window.__palabras = palabras; window.__parrafos = n;
  })();
</script>
</body>
</html>
